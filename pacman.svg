<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="220" viewBox="0 0 1200 220" role="img" aria-label="Pac-Man contribution animation">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#070b10"/>
      <stop offset="100%" stop-color="#101a26"/>
    </linearGradient>
    <linearGradient id="yellow" x1="0" x2="1">
      <stop offset="0%" stop-color="#ffe66b"/>
      <stop offset="100%" stop-color="#ffb347"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#bg)"/>
  <rect x="18" y="16" width="1164" height="188" rx="22" fill="none" stroke="#1d2b3a" stroke-width="1.2"/>

  <text x="34" y="40" fill="#f8fafc" font-size="20" font-weight="700" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    Pac-Man Commit Maze
  </text>
  <text x="34" y="60" fill="#8aa0b6" font-size="12.5" font-weight="500" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    A preview banner that will be refreshed by the GitHub Actions workflow on every push.
  </text>

  <g opacity="0.95">
    <g fill="#1b2430">
      <circle cx="100" cy="110" r="4"/><circle cx="136" cy="110" r="4"/><circle cx="172" cy="110" r="4"/><circle cx="208" cy="110" r="4"/>
      <circle cx="244" cy="110" r="4"/><circle cx="280" cy="110" r="4"/><circle cx="316" cy="110" r="4"/><circle cx="352" cy="110" r="4"/>
      <circle cx="388" cy="110" r="4"/><circle cx="424" cy="110" r="4"/><circle cx="460" cy="110" r="4"/><circle cx="496" cy="110" r="4"/>
      <circle cx="532" cy="110" r="4"/><circle cx="568" cy="110" r="4"/><circle cx="604" cy="110" r="4"/><circle cx="640" cy="110" r="4"/>
      <circle cx="676" cy="110" r="4"/><circle cx="712" cy="110" r="4"/><circle cx="748" cy="110" r="4"/><circle cx="784" cy="110" r="4"/>
      <circle cx="820" cy="110" r="4"/><circle cx="856" cy="110" r="4"/><circle cx="892" cy="110" r="4"/><circle cx="928" cy="110" r="4"/>
      <circle cx="964" cy="110" r="4"/><circle cx="1000" cy="110" r="4"/><circle cx="1036" cy="110" r="4"/><circle cx="1072" cy="110" r="4"/>
    </g>
    <g fill="#163f54">
      <circle cx="118" cy="142" r="4"/><circle cx="154" cy="142" r="4"/><circle cx="190" cy="142" r="4"/><circle cx="226" cy="142" r="4"/>
      <circle cx="262" cy="142" r="4"/><circle cx="298" cy="142" r="4"/><circle cx="334" cy="142" r="4"/><circle cx="370" cy="142" r="4"/>
      <circle cx="406" cy="142" r="4"/><circle cx="442" cy="142" r="4"/><circle cx="478" cy="142" r="4"/><circle cx="514" cy="142" r="4"/>
      <circle cx="550" cy="142" r="4"/><circle cx="586" cy="142" r="4"/><circle cx="622" cy="142" r="4"/><circle cx="658" cy="142" r="4"/>
      <circle cx="694" cy="142" r="4"/><circle cx="730" cy="142" r="4"/><circle cx="766" cy="142" r="4"/><circle cx="802" cy="142" r="4"/>
      <circle cx="838" cy="142" r="4"/><circle cx="874" cy="142" r="4"/><circle cx="910" cy="142" r="4"/><circle cx="946" cy="142" r="4"/>
      <circle cx="982" cy="142" r="4"/><circle cx="1018" cy="142" r="4"/><circle cx="1054" cy="142" r="4"/>
    </g>
  </g>

  <g filter="url(#glow)">
    <circle r="18" fill="url(#yellow)">
      <animateMotion dur="11s" repeatCount="indefinite" rotate="auto" path="M 70 110 H 1080 V 142 H 70"/>
    </circle>
    <path d="M 0 0 L 18 -10 L 18 10 Z" fill="#101a26">
      <animateTransform attributeName="transform" attributeType="XML" type="rotate" values="0;35;0;-35;0" dur="0.2s" repeatCount="indefinite"/>
      <animateMotion dur="11s" repeatCount="indefinite" rotate="auto" path="M 70 110 H 1080 V 142 H 70"/>
    </path>
  </g>

  <g transform="translate(1110 112)" opacity="0.85">
    <circle r="13" fill="#fb7185"/>
    <circle cx="-4" cy="-2" r="2.5" fill="#101a26"/>
    <circle cx="4" cy="-2" r="2.5" fill="#101a26"/>
    <path d="M -8 10 Q 0 16 8 10" fill="none" stroke="#101a26" stroke-width="2" stroke-linecap="round"/>
  </g>

  <g transform="translate(1080 144)" opacity="0.8">
    <circle r="13" fill="#38bdf8"/>
    <circle cx="-4" cy="-2" r="2.5" fill="#101a26"/>
    <circle cx="4" cy="-2" r="2.5" fill="#101a26"/>
    <path d="M -8 10 Q 0 16 8 10" fill="none" stroke="#101a26" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>
