name: Pac-Man Commit Maze

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: pacman-commit-maze
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'push' || github.event.head_commit.author.name != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate Pac-Man SVGs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          node <<'NODE'
          const fs = require('fs');

          const owner = process.env.GITHUB_REPOSITORY_OWNER;
          const token = process.env.GITHUB_TOKEN;
          const now = new Date();
          const from = new Date(now);
          from.setDate(from.getDate() - 364);

          const escapeXml = (value) => String(value)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&apos;');

          async function loadWeeks() {
            const query = `
              query($login: String!, $from: DateTime!, $to: DateTime!) {
                user(login: $login) {
                  name
                  contributionsCollection(from: $from, to: $to) {
                    contributionCalendar {
                      totalContributions
                      weeks {
                        contributionDays {
                          date
                          contributionCount
                        }
                      }
                    }
                  }
                }
              }
            `;

            const response = await fetch('https://api.github.com/graphql', {
              method: 'POST',
              headers: {
                'Authorization': `Bearer ${token}`,
                'Content-Type': 'application/json',
                'User-Agent': 'pacman-commit-maze',
              },
              body: JSON.stringify({
                query,
                variables: {
                  login: owner,
                  from: from.toISOString(),
                  to: now.toISOString(),
                },
              }),
            });

            if (!response.ok) {
              throw new Error(`GitHub GraphQL request failed with ${response.status}`);
            }

            const payload = await response.json();
            const calendar = payload?.data?.user?.contributionsCollection?.contributionCalendar;

            if (!calendar?.weeks?.length) {
              throw new Error('No contribution calendar data returned');
            }

            return {
              name: payload?.data?.user?.name || owner,
              totalContributions: calendar.totalContributions || 0,
              weeks: calendar.weeks,
            };
          }

          function theme(mode) {
            if (mode === 'dark') {
              return {
                background: '#070b10',
                board: '#0b1220',
                border: '#223247',
                empty: '#182236',
                colors: ['#243247', '#32506a', '#3f7ea2', '#59d6ff', '#8affd8'],
                ball: '#ffd84d',
                paddle: '#f8fafc',
                glow: 'url(#glowDark)',
              };
            }

            return {
              background: '#f8fafc',
              board: '#f7fafc',
              border: '#c4d0dd',
              empty: '#d7e1ec',
              colors: ['#c8d5e2', '#84c5df', '#53b8b2', '#2f8ca6', '#1b6f9e'],
              ball: '#ffb700',
              paddle: '#0f172a',
              glow: 'url(#glowLight)',
            };
          }

          function bucketColor(count, maxCount, palette) {
            if (!count) return palette.empty;
            const bucket = Math.min(4, Math.max(1, Math.ceil((count / Math.max(maxCount, 1)) * 4)));
            return palette.colors[bucket];
          }

          function buildSvg(data, mode) {
            const palette = theme(mode);
            const weeks = data.weeks;
            const cell = 11;
            const gap = 3;
            const stride = cell + gap;
            const marginX = 28;
            const marginY = 40;
            const width = marginX * 2 + (weeks.length * stride) + 180;
            const height = 220;
            const maxCount = Math.max(
              1,
              ...weeks.flatMap((week) => week.contributionDays.map((day) => day.contributionCount || 0))
            );

            const cells = weeks.flatMap((week, weekIndex) =>
              week.contributionDays.map((day, dayIndex) => {
                const count = day.contributionCount || 0;
                return [
                  `<rect x="${marginX + (weekIndex * stride)}" y="${marginY + (dayIndex * stride)}" width="${cell}" height="${cell}" rx="2.5" fill="${bucketColor(count, maxCount, palette)}" opacity="${count ? 1 : 0.96}"/>`,
                ].join('');
              })
            ).join('\n      ');

            const ballPath = [
              `M ${marginX - 4} ${marginY + 118}`,
              `H ${width - 170}`,
              `V ${marginY + 96}`,
              `H ${marginX + 40}`,
              `V ${marginY + 118}`,
              `H ${width - 90}`,
            ].join(' ');

            const boardInnerWidth = width - 56;
            const boardInnerHeight = height - 40;
            const glowId = mode === 'dark' ? 'glowDark' : 'glowLight';
            const title = 'Breakout Contribution Graph';

            return `<?xml version="1.0" encoding="UTF-8"?>
            <svg xmlns="http://www.w3.org/2000/svg" width="${width}" height="${height}" viewBox="0 0 ${width} ${height}" role="img" aria-label="${escapeXml(title)}">
              <defs>
                <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
                  <stop offset="0%" stop-color="${palette.background}"/>
                  <stop offset="100%" stop-color="${mode === 'dark' ? '#0b1220' : '#edf3f9'}"/>
                </linearGradient>
                <linearGradient id="${glowId}" x1="0" x2="1">
                  <stop offset="0%" stop-color="${mode === 'dark' ? '#ffe66b' : '#ffd84d'}"/>
                  <stop offset="100%" stop-color="${mode === 'dark' ? '#ff9f1a' : '#f59e0b'}"/>
                </linearGradient>
                <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
                  <feGaussianBlur stdDeviation="8" result="blur"/>
                  <feMerge>
                    <feMergeNode in="blur"/>
                    <feMergeNode in="SourceGraphic"/>
                  </feMerge>
                </filter>
                <pattern id="grid" width="${stride}" height="${stride}" patternUnits="userSpaceOnUse">
                  <path d="M ${stride} 0 H 0 V ${stride}" fill="none" stroke="${mode === 'dark' ? '#122031' : '#e3ebf2'}" stroke-width="0.9" opacity="0.55"/>
                </pattern>
              </defs>

              <rect width="100%" height="100%" fill="url(#bg)"/>
              <rect x="18" y="16" width="${width - 36}" height="${height - 32}" rx="22" fill="${palette.board}" stroke="${palette.border}" stroke-width="1.2" opacity="0.98"/>
              <rect x="28" y="30" width="${boardInnerWidth}" height="${boardInnerHeight}" rx="18" fill="none" stroke="${mode === 'dark' ? '#152236' : '#d6e1eb'}" stroke-width="1"/>
              <rect x="${marginX - 6}" y="${marginY - 6}" width="${weeks.length * stride + 12}" height="${7 * stride + 12}" rx="12" fill="url(#grid)" opacity="0.7"/>

              <g opacity="0.98">
                ${cells}
              </g>

              <g filter="url(#softGlow)">
                <rect x="${marginX + 26}" y="${height - 54}" width="122" height="12" rx="6" fill="${palette.paddle}"/>
                <circle r="9" fill="url(#${glowId})">
                  <animateMotion dur="10s" repeatCount="indefinite" rotate="auto" keySplines="0.4 0 0.2 1" calcMode="spline" path="${ballPath}"/>
                </circle>
              </g>

              <g opacity="0.9">
                <rect x="${width - 188}" y="${height - 61}" width="132" height="10" rx="5" fill="${mode === 'dark' ? '#253449' : '#b8c8d9'}"/>
                <rect x="${width - 56}" y="${height - 61}" width="22" height="10" rx="5" fill="${mode === 'dark' ? '#1cbf8d' : '#1b6f9e'}"/>
              </g>
            </svg>`;
          }

          async function main() {
            let data;

            try {
              data = await loadWeeks();
            } catch (error) {
              data = {
                name: owner,
                totalContributions: 0,
                weeks: Array.from({ length: 53 }, () => ({
                  contributionDays: Array.from({ length: 7 }, () => ({ contributionCount: 0 })),
                })),
              };
              console.warn(error.message);
            }

            fs.writeFileSync('breakout-contribution-graph.svg', buildSvg(data, 'light'));
            fs.writeFileSync('breakout-contribution-graph-dark.svg', buildSvg(data, 'dark'));
            console.log('Pac-Man SVGs updated');
          }

          main().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Publish output branch
        run: |
          if git diff --quiet -- breakout-contribution-graph.svg breakout-contribution-graph-dark.svg; then
            echo "Pac-Man SVGs are already up to date"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C pacman-output
          git add breakout-contribution-graph.svg breakout-contribution-graph-dark.svg
          git commit -m "chore: update pacman contribution art [skip ci]" || exit 0
          git push origin HEAD:pacman-output
